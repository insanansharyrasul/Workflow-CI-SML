name: Train and Build Docker

on:
  workflow_dispatch:
  push:
    paths:
      - "MLProject/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: write

env:
  DOCKER_IMAGE: insanar/smsml-mlflow
  MODEL_DIR: MLProject/artifacts/model
  DATA_PATH: MLProject/dataset_preprocessing/processed.csv

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "mlflow==2.19.0" pandas numpy scikit-learn joblib matplotlib
      - name: Run MLflow Project
        run: |
          mlflow run MLProject --env-manager=local \
            -P data_path=${{ env.DATA_PATH }} \
            -P output_dir=artifacts/model
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-model
          path: ${{ env.MODEL_DIR }}
      - name: Push artifacts branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B artifacts
          mkdir -p artifacts
          rm -rf artifacts/model
          cp -r ${{ env.MODEL_DIR }} artifacts/model
          git add artifacts
          git commit -m "Update model artifacts" || echo "No changes to commit"
          git push -f origin artifacts
      - name: Build Docker image
        run: |
          mlflow models build-docker \
            -m ${{ env.MODEL_DIR }} \
            -n ${{ env.DOCKER_IMAGE }}:${{ github.sha }} \
            --env-manager=local
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push Docker image
        run: |
          docker push ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
